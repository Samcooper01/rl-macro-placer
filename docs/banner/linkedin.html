<!DOCTYPE html>
<!-- The link-preview card, 1200 by 627: the size LinkedIn, Slack and the rest read from
     the page's og:image. placement.png is the last frame of docs/assets/hero.gif, the
     trained agent's finished placement. Render it to docs/assets/preview.png, from this
     directory:
       chromium --headless --window-size=1200,627 --force-device-scale-factor=1 \
         --virtual-time-budget=6000 --screenshot=../assets/preview.png linkedin.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f1e6; --surface: #fffbf3; --border: #ddd0b8;
    --text: #1a1612; --muted: #5e5446; --accent: #b91c1c; --on-accent: #fffbf3;
    --macro: #b91c1c; --cluster: #3f6212;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 627px; overflow: hidden; }
  body {
    background-color: var(--bg);
    background-image: linear-gradient(90deg, rgba(26,22,18,0.045) 1px, transparent 1px),
                      linear-gradient(rgba(26,22,18,0.045) 1px, transparent 1px);
    background-size: 26px 26px;
    font-family: "Source Serif 4", Georgia, serif; color: var(--text); position: relative;
  }
  .rail { position: absolute; left: 0; top: 0; width: 10px; height: 627px; background: var(--accent); }
  .left { position: absolute; left: 68px; top: 88px; width: 580px; }
  .eyebrow {
    font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
  }
  h1 {
    margin-top: 18px; font-family: "Fraunces", Georgia, serif;
    font-size: 54px; font-weight: 700; line-height: 1.05; letter-spacing: -0.015em;
  }
  .tagline { margin-top: 22px; font-size: 21px; line-height: 1.5; color: var(--muted); width: 540px; }
  .cta { position: absolute; left: 68px; bottom: 72px; display: flex; align-items: center; gap: 18px; }
  .cta .button {
    background: var(--accent); color: var(--on-accent); font-family: "Source Serif 4", Georgia, serif;
    font-size: 20px; font-weight: 600; padding: 12px 22px; border-radius: 7px;
  }
  .cta .url { font-family: "JetBrains Mono", monospace; font-size: 15px; color: var(--muted); }
  /* the finished placement, framed like a plot on the desk */
  .shot {
    position: absolute; right: 60px; top: 86px; width: 456px; height: 456px;
    background: var(--surface); border: 2px solid var(--text); border-radius: 10px;
    overflow: hidden; box-shadow: 8px 8px 0 rgba(26,22,18,0.85);
  }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .key {
    position: absolute; right: 60px; top: 560px; width: 456px;
    display: flex; align-items: center; justify-content: center; gap: 22px;
    font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--muted);
  }
  .key span { display: flex; align-items: center; gap: 7px; }
  .key i { width: 12px; height: 12px; border-radius: 2px; display: block; }
  .key .m { background: var(--macro); }
  .key .c { background: var(--cluster); border-radius: 50%; }
</style>
</head>
<body>
  <div class="rail"></div>

  <div class="left">
    <div class="eyebrow">rl-macro-placer</div>
    <h1>Teaching an agent to place chip macros</h1>
    <p class="tagline">A rebuild of Google's reinforcement learning method for chip floorplanning, measured at every step.</p>
  </div>

  <div class="cta">
    <span class="button">Read the write-up &rarr;</span>
    <span class="url">samcooper01.github.io/rl-macro-placer</span>
  </div>

  <div class="shot"><img src="placement.png" alt=""></div>
  <div class="key">
    <span><i class="m"></i>hard macros</span>
    <span><i class="c"></i>standard-cell clusters</span>
  </div>
</body>
</html>
